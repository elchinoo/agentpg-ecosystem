---
# Tear a fleet down: its sandboxes, then its instances (a database and its data are gone for good). Nothing else.
#
#   ansible-playbook destroy.yml --check -e eco_destroy_confirm=ecoans     prints what it would delete, deletes nothing
#   ansible-playbook destroy.yml         -e eco_destroy_confirm=ecoans     deletes it
#
# Safety rails, all tested (tests/test_ansible_recipe.py):
#   - refuses unless eco_destroy_confirm equals the manifest's fleet name exactly
#   - touches only `<fleet>-<app>` sandboxes and `<fleet>-<app>-db` instances of the apps in the manifest: exact names, never a prefix match, never another name
#   - object ids are resolved by name from `agentpg ... list` at run time; the state file is only compared with them
#   - sandboxes first (the reverse of creation: callers, then callees, identity last), then instances
#   - already gone is not an error and not a change
#   - eco_destroy_only: [trustdesk] deletes just those apps (identity only if you list `identity`); eco_destroy_secrets: true also removes .secrets/<fleet>/
- name: Tear down the fleet (AgentPG target)
  hosts: localhost
  gather_facts: false
  tags: [destroy]
  tasks:
    - name: The manifest and the fleet
      ansible.builtin.include_role:
        name: common
        tasks_from: fleet.yml
        public: true

    - name: The confirmation names this fleet
      ansible.builtin.assert:
        that:
          - eco_target == 'agentpg'
          - eco_destroy_confirm | default('') | string == eco_fleet.fleet
        fail_msg: >-
          Refusing to destroy. This deletes every sandbox and instance of the fleet '{{ eco_fleet.fleet }}' (data included). To go on, pass the exact fleet name:
          -e eco_destroy_confirm={{ eco_fleet.fleet }}   (eco_target must be agentpg: for your own hosts, remove the containers and databases yourself)
        quiet: true

    - name: What belongs to this fleet, and nothing else (exact names, in deletion order)
      ansible.builtin.set_fact:
        eco_plan: "{{ eco_fleet | eco_destroy_plan(eco_run_list, eco_destroy_only) }}"

    - name: The plan
      ansible.builtin.debug:
        msg: >-
          {{ ['Will delete from AgentPG, sandboxes first, then instances (instance data is unrecoverable):']
             + (eco_plan | map(attribute='sandbox') | map('regex_replace', '^', '  sandbox ') | list)
             + (eco_plan | map(attribute='instance') | map('regex_replace', '^', '  instance ') | list) }}

    - name: What exists right now (read-only)
      agentpg_sandbox:
        state: absent
        name: "{{ item.sandbox }}"
        allowed_names: "{{ eco_plan | map(attribute='sandbox') | list }}"
        state_file: "{{ eco_secrets_dir }}/agentpg/{{ item.key }}.json"
        agentpg_bin: "{{ eco_agentpg_bin }}"
      loop: "{{ eco_plan }}"
      loop_control: {label: "{{ item.sandbox }}"}
      register: eco_seen_sandboxes
      check_mode: true
      changed_when: false

    - name: ... instances
      agentpg_instance:
        state: absent
        name: "{{ item.instance }}"
        allowed_names: "{{ eco_plan | map(attribute='instance') | list }}"
        state_file: "{{ eco_secrets_dir }}/agentpg/{{ item.key }}.json"
        agentpg_bin: "{{ eco_agentpg_bin }}"
      loop: "{{ eco_plan }}"
      loop_control: {label: "{{ item.instance }}"}
      register: eco_seen_instances
      check_mode: true
      changed_when: false

    - name: What would happen
      ansible.builtin.debug:
        msg: "{{ (eco_seen_sandboxes.results + eco_seen_instances.results) | map(attribute='msg') | list }}"

    - name: Delete the sandboxes (callers first, identity last)
      agentpg_sandbox:
        state: absent
        name: "{{ item.sandbox }}"
        allowed_names: "{{ eco_plan | map(attribute='sandbox') | list }}"
        state_file: "{{ eco_secrets_dir }}/agentpg/{{ item.key }}.json"
        agentpg_bin: "{{ eco_agentpg_bin }}"
        poll_interval: "{{ eco_poll_interval }}"
      loop: "{{ eco_plan }}"
      loop_control: {label: "{{ item.sandbox }}"}

    - name: Delete the instances
      agentpg_instance:
        state: absent
        name: "{{ item.instance }}"
        allowed_names: "{{ eco_plan | map(attribute='instance') | list }}"
        state_file: "{{ eco_secrets_dir }}/agentpg/{{ item.key }}.json"
        agentpg_bin: "{{ eco_agentpg_bin }}"
        poll_interval: "{{ eco_poll_interval }}"
      loop: "{{ eco_plan }}"
      loop_control: {label: "{{ item.instance }}"}

    - name: Remove the local secrets of this fleet (eco_destroy_secrets)
      ansible.builtin.file:
        path: "{{ eco_secrets_dir }}"
        state: absent
      when:
        - eco_destroy_secrets | bool
        - eco_secrets_dir | basename == eco_fleet.fleet

    - name: The local secrets are kept
      ansible.builtin.debug:
        msg: >-
          {{ eco_secrets_dir }} (generated keys, client secrets, state) is still on this machine. It describes a fleet that no longer exists; remove it with
          -e eco_destroy_secrets=true, or delete the directory.
      when: not (eco_destroy_secrets | bool)
