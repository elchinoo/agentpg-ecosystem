---
# One machine plays every part: Docker on this computer runs a throwaway pgvector database, the proxy and the apps.
# Run: ansible-playbook -i inventories/own-infra-local site.yml
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    db:
      hosts: {localhost: {}}
    app:
      hosts: {localhost: {}}
