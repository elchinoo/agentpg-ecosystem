---
# Deploying on AgentPG needs no hosts: every step runs on this machine, which drives the logged-in `agentpg` CLI and calls the apps' HTTPS APIs.
# The empty groups keep the plays of infra_hosts.yml (the `hosts` target) from warning about a missing group.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    db: {}
    app: {}
    eco_proxy: {}
