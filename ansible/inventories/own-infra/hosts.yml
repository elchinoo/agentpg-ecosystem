---
# A small real layout: one database server, two app hosts. Replace the names and addresses. Every host needs SSH, python3 and sudo;
# the db host needs python3-psycopg2 (or psycopg 3), the app hosts need Docker (or Podman).
all:
  children:
    db:
      hosts:
        pg1.example.com:
          eco_db_address: 10.0.1.10          # how the app containers reach it (private address)
    app:
      hosts:
        apps1.example.com:                   # runs the proxy and, by default, every app
        apps2.example.com:                   # optional: only runs what eco_placement gives it
