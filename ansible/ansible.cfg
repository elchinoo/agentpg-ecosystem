[defaults]
roles_path = roles
filter_plugins = plugins/filter
action_plugins = plugins/action
# the vault password file, if you use one, is named here or with --vault-password-file; this repository never contains it
inventory = inventories/agentpg
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# facts are never cached: the secrets live encrypted in .secrets/<fleet>/state.sealed, not in a fact cache
gathering = explicit
retry_files_enabled = False
host_key_checking = True

[connection]
# Modules reach the (local) target through stdin, not through a temporary file: a module's arguments (a bearer token in `uri`, a login password) are never written to disk.
pipelining = True

[ssh_connection]
pipelining = True
