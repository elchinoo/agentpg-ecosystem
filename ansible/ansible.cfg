[defaults]
roles_path = roles
filter_plugins = plugins/filter
# the vault password file, if you use one, is named here or with --vault-password-file; this repository never contains it
inventory = inventories/agentpg
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
# facts are never cached: the secrets live in .secrets/, not in a fact cache
gathering = explicit
retry_files_enabled = False
host_key_checking = True

[ssh_connection]
pipelining = True
