---
# Resolve the operator's admin password once per run into eco_admin_pw (a fact; never printed, never in a log: every task that touches it has no_log).
# Order: eco_admin_password (Ansible Vault or ECO_ADMIN_PASSWORD) > a prompt (eco_admin_password_prompt) > the generated-once file (mode 0600, git-ignored).
# eco_admin_new is true when the file did not exist before this run: a vault that already exists must never be given a made-up password.
- name: The admin password was given (variable, Ansible Vault or ECO_ADMIN_PASSWORD)
  ansible.builtin.set_fact:
    eco_admin_given: "{{ eco_admin_password | default('') | length > 0 }}"
  no_log: true

- name: Ask for the admin password (eco_admin_password_prompt; it is not kept)
  ansible.builtin.pause:
    prompt: "Admin password of the identity provider and gateway vaults (input hidden)"
    echo: false
  register: eco_admin_prompted
  no_log: true
  when: eco_admin_password_prompt | bool and not eco_admin_given | bool

- name: The prompted password is the one to use
  ansible.builtin.set_fact:
    eco_admin_password: "{{ eco_admin_prompted.user_input }}"
    eco_admin_given: true
  no_log: true
  when: eco_admin_prompted is not skipped and eco_admin_prompted.user_input | default('') | length > 0

- name: Does a generated admin password exist from an earlier run?
  ansible.builtin.stat:
    path: "{{ eco_admin_password_file }}"
  register: eco_admin_file
  check_mode: false
  when: not eco_admin_given | bool

- name: The directory of the generated password (private)
  ansible.builtin.file:
    path: "{{ eco_admin_password_file | dirname }}"
    state: directory
    mode: "0700"
  when: not eco_admin_given | bool

- name: The admin password, as a fact for this run
  ansible.builtin.set_fact:
    eco_admin_pw: >-
      {{ eco_admin_password if eco_admin_given | bool
         else lookup('ansible.builtin.password', eco_admin_password_file ~ ' length=32 chars=ascii_letters,digits,-,_') }}
    eco_admin_new: "{{ not eco_admin_given | bool and not eco_admin_file.stat.exists }}"
  no_log: true

- name: The generated password file is private
  ansible.builtin.file:
    path: "{{ eco_admin_password_file }}"
    state: file
    mode: "0600"
  when: not eco_admin_given | bool

- name: A password was generated
  ansible.builtin.debug:
    msg: >-
      A strong admin password for the vaults was generated into {{ eco_admin_password_file }} (mode 0600, git-ignored). Copy it to your password manager now:
      after a platform restart the vaults need it and the platform does not hold it. (Or pass your own through an Ansible Vault file: see docs/07-ansible-deployment.md.)
  when: eco_admin_new | bool
