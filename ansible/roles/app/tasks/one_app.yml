---
- name: "{{ eco_item_key }}: the app"
  ansible.builtin.set_fact:
    eco_item: "{{ eco_fleet | eco_get(eco_item_key) }}"

- name: "{{ eco_item.name }}: register its web client with the identity provider"
  ansible.builtin.include_role:
    name: common
    tasks_from: ensure_app.yml
  vars:
    eco_spec: "{{ eco_item | eco_web_spec }}"
    eco_secret_kind: client_secret
    eco_issue_scope: "{{ eco_item.key }}"
  when: eco_http | bool and eco_identity_mode != 'oidc' and eco_item.web

- name: "{{ eco_item.name }}: register its service client (scopes of the apps it calls)"
  ansible.builtin.include_role:
    name: common
    tasks_from: ensure_app.yml
  vars:
    eco_spec: "{{ eco_item | eco_service_spec }}"
    eco_secret_kind: service_secret
    eco_issue_scope: "{{ eco_item.key }}"
  when: eco_http | bool and eco_identity_mode != 'oidc' and eco_item.service

- name: "{{ eco_item.name }}: its LLM gateway client and key"
  ansible.builtin.include_role:
    name: llm_gateway
    tasks_from: client.yml
  when: eco_http | bool and eco_item.deploy and eco_item.llm and eco_llm_mode in ['managed', 'existing']

- name: "{{ eco_item.name }}: container"
  ansible.builtin.include_tasks: deploy.yml
  when: eco_item.deploy and eco_item.key in eco_run_list

- name: "{{ eco_item.name }}: where its sign-in points now (the list is a summary: no redirect addresses)"
  ansible.builtin.uri:
    url: "{{ eco_urls.identity }}/api/apps/{{ eco_item.key }}"
    headers: {Authorization: "Bearer {{ eco_secrets['identity/IDENTITY_API_KEY'] }}"}
    validate_certs: "{{ eco_validate_certs }}"
    return_content: true
  register: eco_signin_now
  check_mode: false
  changed_when: false
  no_log: true
  when:
    - eco_http | bool
    - eco_identity_mode != 'oidc'
    - eco_item.deploy
    - eco_item.web

- name: "{{ eco_item.name }}: point its sign-in at the real URL"
  ansible.builtin.uri:
    url: "{{ eco_urls.identity }}/api/apps/{{ eco_item.key }}"
    method: PATCH
    body_format: json
    body:
      url: "{{ eco_urls[eco_item.key] }}"
      redirect_uris: ["{{ eco_urls[eco_item.key] }}/auth/callback"]
      post_logout_uris: ["{{ eco_urls[eco_item.key] }}/"]
    headers: {Authorization: "Bearer {{ eco_secrets['identity/IDENTITY_API_KEY'] }}"}
    validate_certs: "{{ eco_validate_certs }}"
  no_log: true
  when:
    - eco_http | bool
    - eco_identity_mode != 'oidc'
    - eco_item.deploy
    - eco_item.web
    - (eco_signin_now.json.redirect_uris | default([])) != [eco_urls[eco_item.key] ~ '/auth/callback'] or (eco_signin_now.json.url | default('')) != eco_urls[eco_item.key]
  changed_when: true
