---
# Instance, extensions, sandbox, unseal, URL of one app (eco_item): what ecoctl's `_deploy` and unseal step do, with the same `agentpg` commands. The sandbox gets only
# APGKIT_SEALED (its secrets, encrypted under the operator's passphrase) and non-secret settings. Existing instances and
# sandboxes are kept; a changed environment is reported (eco_env_change: recreate applies it, eco_recreate forces it).
# Check mode reads only: it says what would be created and changes nothing (the services' HTTP APIs are not touched).
- name: "{{ eco_item.key }}: database instance {{ eco_item.instance_name }}"
  agentpg_instance:
    name: "{{ eco_item.instance_name }}"
    size: "{{ eco_fleet.agentpg.size }}"
    state_file: "{{ eco_secrets_dir }}/agentpg/{{ eco_item.key }}.json"
    agentpg_bin: "{{ eco_agentpg_bin }}"
    poll_interval: "{{ eco_poll_interval }}"
    timeout: "{{ eco_provision_timeout }}"
  register: eco_inst
  ignore_errors: true
  no_log: true                  # the answer carries the database key, which AgentPG shows only once

- name: "{{ eco_item.key }}: keep the database key (shown only once) in the encrypted state, even if the run failed right after creating it"
  eco_state:
    op: put_db_key
    path: "{{ eco_state_file }}"
    passphrase: "{{ eco_seal_passphrase | default(omit) }}"
    app: "{{ eco_item.key }}"
    value: "{{ eco_inst.new_db_key }}"
  register: eco_dbkey
  ignore_errors: true
  no_log: true
  when: eco_inst.new_db_key | default('') | length > 0

- name: "{{ eco_item.key }}: the database instance or its key could not be handled"
  ansible.builtin.fail:
    msg: "{{ eco_inst.msg | default('agentpg_instance failed') if eco_inst is failed else eco_dbkey.msg | default('the database key could not be kept: delete the instance and run again') }}"
  when: eco_inst is failed or eco_dbkey is failed

- name: "{{ eco_item.key }}: extensions"
  agentpg_extension:
    instance_id: "{{ eco_inst.instance_id }}"
    names: "{{ eco_item.extensions }}"
    state_file: "{{ eco_secrets_dir }}/agentpg/{{ eco_item.key }}.json"
    agentpg_bin: "{{ eco_agentpg_bin }}"
    poll_interval: "{{ eco_poll_interval }}"
    timeout: "{{ eco_provision_timeout }}"
  when: eco_item.extensions | length > 0

- name: "{{ eco_item.key }}: its environment (plain values and secrets) and the sealed blob"
  ansible.builtin.include_tasks: split_env.yml

- name: "{{ eco_item.key }}: sandbox {{ eco_item.sandbox_name }} ({{ eco_item.image_ref }}): only APGKIT_SEALED and non-secret settings"
  agentpg_sandbox:
    name: "{{ eco_item.sandbox_name }}"
    image: "{{ eco_item.image_ref }}"
    instance_id: "{{ eco_inst.instance_id }}"
    port: "{{ eco_item.port }}"
    env: "{{ eco_env | combine({'APGKIT_SEALED': eco_sealed.blob | default('not-sealed-in-check-mode')}) }}"
    settings_hash: "{{ eco_settings_hash }}"
    auto_pause: "{{ eco_item.pause }}"
    plan: "{{ eco_item.plan_eff | default(omit, true) }}"
    recreate: "{{ eco_item.key in eco_recreate_set }}"
    on_change: "{{ eco_env_change }}"
    state_file: "{{ eco_secrets_dir }}/agentpg/{{ eco_item.key }}.json"
    agentpg_bin: "{{ eco_agentpg_bin }}"
    poll_interval: "{{ eco_poll_interval }}"
    timeout: "{{ eco_provision_timeout }}"
  register: eco_sbx
  no_log: true                  # the blob is ciphertext, but nothing about a secret needs to be in a log

- name: "{{ eco_item.key }}: what AgentPG has, and what would change"
  ansible.builtin.debug:
    msg: "{{ eco_inst.msg }}; sandbox: {{ eco_sbx.msg }}"

- name: "{{ eco_item.key }}: its URL"
  ansible.builtin.set_fact:
    eco_urls: "{{ eco_urls | combine({eco_item.key: eco_sbx.url}) }}"
  when: eco_sbx.url | length > 0

- name: "{{ eco_item.key }}: the environment differs from the running sandbox"
  ansible.builtin.debug:
    msg: >-
      {{ eco_item.sandbox_name }} exists with a different environment (a callee was recreated, or the manifest changed). Apply it with
      -e '{"eco_recreate": ["{{ eco_item.key }}"]}' or eco_env_change=recreate: the sandbox is deleted and created again, its database keeps its data.
  when: eco_sbx.env_differs | default(false)

- name: "{{ eco_item.key }}: unseal it with the operator's passphrase (sent encrypted to a key that exists only in the app's process)"
  eco_state:
    op: unseal
    url: "{{ eco_urls[eco_item.key] }}"
    passphrase: "{{ eco_seal_passphrase | default(omit) }}"
    validate_certs: "{{ eco_validate_certs }}"
    timeout: "{{ eco_unseal_timeout }}"
  register: eco_unsealed
  ignore_errors: true
  no_log: true
  when: eco_http | bool and eco_urls[eco_item.key] | length > 0

- name: "{{ eco_item.key }}: it could not be unsealed"
  ansible.builtin.fail:
    msg: "{{ eco_item.key }}: {{ eco_unsealed.msg | default('eco_state failed') }}"
  when: eco_unsealed is failed

- name: "{{ eco_item.key }}: unsealed"
  ansible.builtin.debug:
    msg: "{{ eco_unsealed.msg }}"
  when: eco_unsealed is not skipped

- name: "{{ eco_item.key }}: wait until it answers {{ eco_wait_path }}"
  ansible.builtin.uri:
    url: "{{ eco_urls[eco_item.key] }}{{ eco_wait_path }}"
    validate_certs: "{{ eco_validate_certs }}"
  vars:
    eco_wait_path: "{{ '/readyz' if eco_item.key in ['identity', eco_fleet.llm.gateway] else eco_item.health }}"        # after the unseal above: /readyz says `locked` until then
  register: eco_up
  until: eco_up.status | default(0) == 200
  retries: 60
  delay: 3
  changed_when: false
  when: eco_http | bool and eco_urls[eco_item.key] | length > 0
