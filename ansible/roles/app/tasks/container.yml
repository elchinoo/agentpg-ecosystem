---
# Env file, container, unseal, readiness of one app (eco_item): the identity provider and every app go through here. The env file holds only the sealed blob and
# non-secret settings; the database URL is inside the blob.
- name: "{{ eco_item.key }}: DATABASE_URL"
  ansible.builtin.set_fact:
    eco_database_url: >-
      postgresql://{{ eco_fleet | eco_db_name(eco_item.key) }}:{{ eco_secrets[eco_item.key ~ '/DB_PASSWORD'] }}@{{ eco_db_address }}:{{ eco_db_app_port }}/{{ eco_fleet | eco_db_name(eco_item.key) }}?sslmode={{ eco_db_sslmode }}
  no_log: true

- name: "{{ eco_item.key }}: its environment (plain values and secrets), in memory"
  ansible.builtin.include_tasks: split_env.yml
  vars:
    eco_inst: {}

- name: "{{ eco_item.key }}: the env file it has now (it holds only ciphertext and plain settings; its first line is the hash of the settings)"
  ansible.builtin.slurp:
    src: "{{ eco_data_dir }}/env/{{ eco_item.key }}.env"
  register: eco_envfile_now
  delegate_to: "{{ eco_placed[eco_item.key] }}"
  become: "{{ eco_become }}"
  failed_when: false
  check_mode: false

- name: "{{ eco_item.key }}: env file (APGKIT_SEALED and non-secret settings only, mode 0600)"
  ansible.builtin.template:
    src: app.sealed.env.j2
    dest: "{{ eco_data_dir }}/env/{{ eco_item.key }}.env"
    mode: "0600"
  vars:
    eco_env_public: "{{ eco_env | combine({'APGKIT_SEALED': eco_sealed.blob | default('')}) }}"
    eco_hash_line: "# settings-hash: {{ eco_settings_hash }}"
  delegate_to: "{{ eco_placed[eco_item.key] }}"
  become: "{{ eco_become }}"
  register: eco_envfile
  no_log: true
  diff: false
  when:
    - eco_sealed is not skipped
    - (eco_envfile_now.content | default('') | b64decode).splitlines() | first | default('') != eco_hash_line

- name: "{{ eco_item.key }}: container {{ eco_fleet.fleet }}-{{ eco_item.key }}"
  ansible.builtin.include_role:
    name: container_host
    tasks_from: run.yml
  vars:
    eco_c_name: "{{ eco_fleet.fleet }}-{{ eco_item.key }}"
    eco_c_image: "{{ eco_item.image_ref }}"
    eco_c_host: "{{ eco_placed[eco_item.key] }}"
    eco_c_extra: "{{ eco_settings_hash }}"
    eco_c_args: >-
      {{ ['--network', eco_network, '--env-file', eco_data_dir ~ '/env/' ~ eco_item.key ~ '.env']
         + (['--volume', eco_ca_path ~ ':/etc/eco/ca.crt:ro'] if eco_ca_path else [])
         + (['--publish', eco_publish_address ~ ':' ~ eco_host_ports[eco_item.key] ~ ':' ~ eco_item.port] if eco_placed[eco_item.key] != eco_proxy_host else []) }}

- name: "{{ eco_item.key }}: unseal it with the operator's passphrase (sent encrypted to a key that exists only in the app's process)"
  eco_state:
    op: unseal
    url: "{{ eco_urls[eco_item.key] }}"
    passphrase: "{{ eco_seal_passphrase | default(omit) }}"
    validate_certs: "{{ eco_validate_certs }}"
    timeout: "{{ eco_unseal_timeout }}"
  register: eco_unsealed
  ignore_errors: true
  no_log: true
  delegate_to: localhost
  become: false
  when: eco_http | bool and eco_urls[eco_item.key] | length > 0

- name: "{{ eco_item.key }}: it could not be unsealed"
  ansible.builtin.fail:
    msg: "{{ eco_item.key }}: {{ eco_unsealed.msg | default('eco_state failed') }}"
  when: eco_unsealed is failed

- name: "{{ eco_item.key }}: wait until it answers {{ eco_wait_path }}"
  ansible.builtin.uri:
    url: "{{ eco_urls[eco_item.key] }}{{ eco_wait_path }}"
    validate_certs: "{{ eco_validate_certs }}"
  vars:
    eco_wait_path: "{{ '/readyz' if eco_item.key in ['identity', eco_fleet.llm.gateway] else eco_item.health }}"        # after the unseal above
  register: eco_up
  until: eco_up.status | default(0) == 200
  retries: 60
  delay: 3
  check_mode: false
  changed_when: false
  when: not ansible_check_mode
