---
# Keep a secret that a service shows only once (a client secret, a gateway key) in the encrypted state, and in eco_issued for the rest of this play.
# Inputs: eco_issue_name ("<app>/<kind>"), eco_issue_value.
- name: "Keep {{ eco_issue_name }} in the encrypted state"
  eco_state:
    op: put_issued
    path: "{{ eco_state_file }}"
    passphrase: "{{ eco_seal_passphrase | default(omit) }}"
    name: "{{ eco_issue_name }}"
    value: "{{ eco_issue_value }}"
  register: eco_kept
  ignore_errors: true
  delegate_to: localhost
  become: false
  no_log: true
  when: eco_issue_value | length > 0

- name: "{{ eco_issue_name }} could not be kept (the service shows it only once: it must be recreated)"
  ansible.builtin.fail:
    msg: "{{ eco_kept.msg | default('eco_state failed') }}"
  when: eco_kept is failed

- name: "Remember {{ eco_issue_name }} for this play"
  ansible.builtin.set_fact:
    eco_issued: "{{ eco_issued | combine({eco_issue_name: eco_issue_value}) }}"
  no_log: true
  when: eco_issue_value | length > 0
