[project]
name = "agentpg-ecosystem"
version = "0.1.0"
description = "ecoctl: describe a fleet of apps in one ecosystem.yaml, register it with the identity provider and provision it on AgentPG."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ecoctl = "ecoctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecoctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 170

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
