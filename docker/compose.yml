    - source: pg_superuser
      target: pg_superuser
    volumes:
    - pgdata:/var/lib/postgresql/data
    - ./initdb/20-app-databases.sh:/docker-entrypoint-initdb.d/20-app-databases.sh:ro
    ports:
    - 127.0.0.1:55460:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -h 127.0.0.1 -U postgres
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  identity:
    image: ecosystem-dev/identity:dev
    build:
      context: ../../identity
    environment:
      APGKIT_SEALED_FILE: /run/secrets/apgkit_sealed
      IDENTITY_DEV_HTTP: '1'
      IDENTITY_ISSUER: http://identity.localhost:8101
      IDENTITY_PUBLIC_URL: http://identity.localhost:8101
      PORT: '8101'
    secrets:
    - source: sealed_identity
      target: apgkit_sealed
    ports:
    - 127.0.0.1:8101:8101
    networks:
      default:
        aliases:
        - identity.localhost
    depends_on:
      postgres:
        condition: service_healthy
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
  llmgw:
